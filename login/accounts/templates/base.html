<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication</title>
  <style>
        .blink-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            animation: blink 2s infinite;
            transition: background-color 0.5s ease:
        }

        @keyframes blink {
            0% {
                opacity: 1;
                background-color: #007bff;
            }
            50% {
                opacity: 0;
                background-color: #dc3545;
            }
            100% {
                opacity: 1;
                background-color: #007bff;
            }
        }
        .login-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .login-button:hover {
            background-color: #218838;
        }
        .or-text {
          display: inline-block;
          padding: 10px 15px;
          font-weight: bold;
          color: #555;
          vertical-align: middle;
        }
    </style>
</head>
<body>
  <main>
    {% block content %}
    {% endblock %}
  </main>
</body>
</html>
