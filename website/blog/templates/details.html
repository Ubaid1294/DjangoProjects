<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 30px;
        }

        h2 {
            color: #007bff;
        }

        .post-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .post-meta {
            font-size: 14px;
            color: #888;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #007bff;
            border: 1px solid #007bff;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background-color: #007bff;
            color: white;
        }

        hr {
            margin: 20px 0;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-image">

    <h2>{{ post.title }}</h2>
    <p class="post-meta">Published on: {{ post.pub_date }}</p>
    <hr>
    <p>{{ post.body }}</p>

    <a href="/" class="back-button">Back to Home</a>
</div>

</body>
</html>
